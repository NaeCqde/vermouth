[package]
license = "MIT"
name = "vermouth_common"
version = "0.1.0"
edition = "2021"

[features]
# `client`: fetch the container from the server (used by the client and by nanokvm)
client = ["dep:reqwest", "dep:serde", "dep:serde_json"]

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.2"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "http2",
    "macos-system-configuration",
], optional = true }
